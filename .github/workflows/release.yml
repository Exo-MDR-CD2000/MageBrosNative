# Builds the Windows zip on every push to main and publishes it as a GitHub release named after
# the version in CMakeLists.txt (project(MageBrosNative VERSION x.y.z)). A push that doesn't
# change the version (docs only, for example) finds the release already there and stops.
#
# The runner has no MageBros.exe (it must never be uploaded), so only the tests that need no game
# files run here; the map and hero tests run locally through make_release.bat. The zip contains no
# game content either: players still point it at their own MageBros.exe.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # to create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content -Raw CMakeLists.txt
          if ($text -notmatch 'project\(MageBrosNative VERSION (\d+\.\d+\.\d+)') { throw 'No version in CMakeLists.txt' }
          $ver = $Matches[1]
          "version=$ver" >> $env:GITHUB_OUTPUT
          gh release view "v$ver" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$ver already exists: nothing to do."
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Configure
        if: steps.version.outputs.exists == 'false'
        run: cmake -S . -B build -A x64

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: cmake --build build --config Release

      - name: Test (no game files)
        if: steps.version.outputs.exists == 'false'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        if: steps.version.outputs.exists == 'false'
        working-directory: build
        run: cpack -C Release

      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          $zip = "build/MageBrosNative-$ver-windows-x64.zip"
          if (-not (Test-Path $zip)) { throw "$zip was not made" }
          $notes = @(
            (git log -1 --format=%B),
            '',
            'Unzip anywhere and put MageBrosNative.exe next to your own copy of MageBros.exe (the',
            'freeware 2.0 build), or run it with --game PATH. The zip contains no game content.'
          ) -join "`n"
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release create "v$ver" $zip --title "Mage Bros. Native $ver" --notes-file notes.md --target $env:GITHUB_SHA
