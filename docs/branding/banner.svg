    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd978"/><stop offset="1" stop-color="#f2a93b"/></linearGradient>
    <radialGradient id="glowBlue"><stop offset="0" stop-color="#5b8cff" stop-opacity="0.45"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowPink"><stop offset="0" stop-color="#ff6fb5" stop-opacity="0.42"/><stop offset="1" stop-color="#ff6fb5" stop-opacity="0"/></radialGradient>
    <radialGradient id="spark"><stop offset="0" stop-color="#fff6c8"/><stop offset="0.35" stop-color="#ffd25e" stop-opacity="0.8"/><stop offset="1" stop-color="#ffd25e" stop-opacity="0"/></radialGradient>
