<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <!-- Mage Bros. Native README banner. Original artwork (no game images). Text: Inter. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b0d08"/><stop offset="0.6" stop-color="#2c140b"/><stop offset="1" stop-color="#341709"/></linearGradient>
    <pattern id="brick" width="80" height="40" patternUnits="userSpaceOnUse"><path d="M0 0.5 H80 M0 20.5 H80 M40 0 V20 M0 20 V40 M80 20 V40" stroke="#0c0503" stroke-width="2" fill="none"/></pattern>
    <radialGradient id="torchLight"><stop offset="0" stop-color="#ff9a3c" stop-opacity="0.5"/><stop offset="0.5" stop-color="#ff6a1a" stop-opacity="0.16"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a14"/><stop offset="0.6" stop-color="#ffa531"/><stop offset="1" stop-color="#ffe08a"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a3a33"/><stop offset="0.5" stop-color="#a08a7c"/><stop offset="1" stop-color="#3a2c26"/></linearGradient>
